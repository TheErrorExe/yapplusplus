<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        webview { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="status-message" style="color: white; text-align: center; margin-top: 50vh; font-family: sans-serif;"></div>
    <h1>AAAAAAA</h1>
    <script>
        async function selectOption(action) {
            const statusEl = document.getElementById('status-message');
            if (action === 'install') {
                statusEl.innerText = "Patience! Yap++ Is becoming an app. This should take no more than 15 seconds.";
                setTimeout(() => {
                    statusEl.innerText = "Installation complete! Launching Yap++...";
                    if (window.electronAPI && window.electronAPI.launchClient) {
                        window.electronAPI.launchClient();
                    } else {
                        statusEl.innerText = "[Libyapcroe] fuck..";
                    }
                }, 15000);

            } else if (action === 'client') {
                statusEl.innerText = "Launching";
                if (window.electronAPI && window.electronAPI.launchClient) {
                    window.electronAPI.launchClient();
                } else {
                    statusEl.innerText = "[Libyapcore] we're fucked.";
                }
            }
        }
    </script>
</body>
</html>
