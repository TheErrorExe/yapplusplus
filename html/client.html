<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        webview { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <webview id="yapper-view" src="https://yapper.website"></webview>
    <script>
        const webview = document.getElementById('yapper-view');
        let retryCount = 0;

        webview.addEventListener('did-finish-load', async () => {
            retryCount = 0;
            console.log("[Libyapcore] [S]");
            try {
                const assets = {
                    staff: await window.electronAPI.getAsset('Staffcontrib.png'),
                    helper: await window.electronAPI.getAsset('Helper.png'),
                    vim: await window.electronAPI.getAsset('Vim.png'),
                    potato: await window.electronAPI.getAsset('Cutepotato.png'),
                    whitebox: await window.electronAPI.getAsset('whiteboxbadgeidkwhy.png'),
                    sigma: await window.electronAPI.getAsset('Hefeelsverysigma.png'),
                    chud: await window.electronAPI.getAsset('CERTIFIEDCHUD.png')
                };
                await webview.executeJavaScript(`window.YapPlusAssets = ${JSON.stringify(assets)};`);
                setTimeout(async () => {
                    const pluginCode = await window.electronAPI.getPlugins();
                    if (pluginCode && pluginCode.trim().length > 0) {
                        try {
                            await webview.executeJavaScript(pluginCode);
                        } catch (err) {
                            console.error("[Libyapcore] [E] P.E.F>", err);
                        }
                    }
                }, 1500);

            } catch (err) {
            }
        });

        webview.addEventListener('did-fail-load', (event) => {
            console.error(`[Libyapcore] [E]> ${event.errorCode}: ${event.errorDescription}`);
            if (event.isMainFrame && retryCount < 3) {
                retryCount++;
                console.log(`[Libyapcore] [I]> R.C> ${retryCount}`);
                setTimeout(() => {
                    webview.reload();
                }, 2000);
            }
        });
    </script>
</body>
</html>
